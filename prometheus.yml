# Конфигурация Prometheus для мониторинга Firehorse MVP
# Scrape интервал: 15 секунд
# Хранение данных: 7 дней

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'firehorse-monitoring'
    environment: 'production'

# Правила для алертов (пока пусто)
rule_files:
  # - "alert_rules.yml"

# Конфигурация алертинга (пока пусто)
alerting:
  alertmanagers:
    # - static_configs:
    #   - targets: ['alertmanager:9093']

# Конфигурация scrape targets
scrape_configs:
  # Мониторинг самого Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: /metrics

  # Мониторинг Firehorse API
  - job_name: 'firehorse-api'
    static_configs:
      - targets: ['api:8000']
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(?::\d+)?'
        replacement: '${1}'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(http_.*|orders_.*|queue_.*|external_api_.*|db_.*|system_.*|cache_.*)'
        action: keep
