# Конфигурация Prometheus для мониторинга Firehorse MVP
# Scrape интервал: 15 секунд
# Хранение данных: 7 дней

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'firehorse-monitoring'
    environment: 'production'

# Правила для алертов (пока пусто)
rule_files:
  # - "alert_rules.yml"

# Конфигурация алертинга (пока пусто)
alerting:
  alertmanagers:
    # - static_configs:
    #   - targets: ['alertmanager:9093']

# Конфигурация scrape targets
scrape_configs:
  # Мониторинг самого Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: /metrics

  # Мониторинг Firehorse API
  - job_name: 'firehorse-api'
    static_configs:
      - targets: ['api:8000']
    scrape_interval: 15s
    metrics_path: /metrics
    # Таймаут для scrape запросов
    scrape_timeout: 10s
    # Метки для всех метрик этого job
    labels:
      service: 'firehorse-api'
      component: 'backend'
    # Конфигурация relabeling (переименование меток)
    relabel_configs:
      # Добавить метку instance с именем хоста
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(?::\d+)?'
        replacement: '${1}'
    # Конфигурация метрик (удаление ненужных метрик)
    metric_relabel_configs:
      # Оставить только метрики Firehorse
      - source_labels: [__name__]
        regex: '(http_.*|orders_.*|queue_.*|external_api_.*|db_.*|system_.*|cache_.*)'
        action: keep

  # Мониторинг Node (системные метрики) - опционально
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #   scrape_interval: 30s

# Настройки хранения
storage:
  tsdb:
    # Путь к данным (соответствует volume в docker-compose)
    path: /prometheus
    # Время хранения
    retention:
      time: 7d
      size: 512MB
    # Настройки WAL (Write-Ahead Log)
    wal:
      segment_size: 128MB
      max_segment_size: 256MB

# Настройки удаленного чтения/записи (пока не используется)
# remote_write:
#   - url: http://remote-prometheus:9090/api/v1/write
# remote_read:
#   - url: http://remote-prometheus:9090/api/v1/read

# Настройки веб-интерфейса
web:
  # Адрес для доступа к веб-интерфейсу
  external_url: http://localhost:9090
  # Настройки CORS
  cors_origin:
    - .*
  # Настройки безопасности
  enable_admin_api: true
  enable_lifecycle: true
  # Настройки страницы
  page_title: "Firehorse Monitoring"
  # Настройки консолей
  console_libraries_consoles: /etc/prometheus/consoles
  console_libraries: /etc/prometheus/console_libraries

# Настройки запросов
query:
  # Таймаут для запросов
  timeout: 2m
  # Максимальное количество образцов в запросе
  max_samples: 50000000
  # Настройки lookback delta (для rate() и других функций)
  lookback_delta: 5m

# Настройки правил
rule_files: []
# rule_files:
#   - /etc/prometheus/rules/*.yml

# Настройки алертинга
alerting_rules: []
# alerting_rules:
#   - /etc/prometheus/alerts/*.yml

# Настройки удаленного хранилища (пока не используется)
remote_write: []
remote_read: []

# Настройки тюнинга
tuning:
  # Настройки памяти
  memory:
    # Максимальное использование памяти для запросов
    max_query_memory: 2GB
    # Настройки кэша
    cache:
      # Размер кэша для метрик
      metric_label_cache_size: 65536
      # Размер кэша для результатов запросов
      query_result_cache_size: 1000