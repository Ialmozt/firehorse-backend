version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firehorse-api
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - INGRESS_SECRET=${INGRESS_SECRET}
      - USE_PROXY=${USE_PROXY}
      - PROXY_HOST=${PROXY_HOST}
      - PROXY_PORT=${PROXY_PORT}
      - PROXY_TYPE=${PROXY_TYPE}
    volumes:
      - ./:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    network_mode: host

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firehorse-worker
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - USE_PROXY=${USE_PROXY}
      - PROXY_HOST=${PROXY_HOST}
      - PROXY_PORT=${PROXY_PORT}
      - PROXY_TYPE=${PROXY_TYPE}
    volumes:
      - ./:/app
    restart: unless-stopped
    command: python -m src.worker
    network_mode: host
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    container_name: firehorse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - firehorse-net
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: firehorse-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    networks:
      - firehorse-net
    depends_on:
      - prometheus

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: firehorse-telegram-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - FIREHORSE_WEBHOOK_URL=http://localhost:8000/webhook
      - INGRESS_SECRET=${INGRESS_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./telegram-bot:/app
      - /var/log/firehorse-telegram.log:/var/log/firehorse-telegram.log
    restart: unless-stopped
    network_mode: host
    depends_on:
      - api

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  firehorse-net:
    driver: bridge
